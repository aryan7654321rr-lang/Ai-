name: NOVA-X APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find NOVA-X ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract NOVA-X
        run: |
          rm -rf nova_project
          mkdir -p nova_project

          unzip -q "$ZIP_FILE" -d nova_project

          echo "Extracted files:"
          find nova_project -maxdepth 3 -type f | sort | head -200

      - name: Locate project
        run: |
          PACKAGE_FILE=$(find nova_project \
            -type f \
            -name "package.json" \
            -print \
            -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Verify project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f package.json
          test -f index.html
          test -d src

          echo "NOVA-X project is valid."

      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install

      - name: Ensure Vue and Vite
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install --save-dev vite@7 @vitejs/plugin-vue@6
          npm install vue@3

      - name: Ensure Vite configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f vite.config.js ] && \
             [ ! -f vite.config.mjs ] && \
             [ ! -f vite.config.ts ]; then

            cat > vite.config.js <<'EOF'
          import { defineConfig } from 'vite'
          import vue from '@vitejs/plugin-vue'

          export default defineConfig({
            plugins: [vue()]
          })
          EOF

          fi

      - name: Build Vue application
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run build

      - name: Verify Vue build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -d dist
          echo "Vue build completed successfully."

      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install --no-save \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7

      - name: Configure Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ]; then

            npx cap init NOVA-X com.novax --web-dir dist
          fi

      - name: Create Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android directory already exists."
          fi

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap sync android

      # --------------------------------------------------
      # Find the actual Gradle wrapper
      # --------------------------------------------------
      - name: Locate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Searching for gradlew..."

          find . \
            -type f \
            -name "gradlew" \
            -print

          GRADLEW=$(find . \
            -type f \
            -name "gradlew" \
            -print \
            -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Gradle wrapper was not generated."
            echo ""
            echo "Android directory contents:"
            find android -maxdepth 4 -type f | sort || true
            exit 1
          fi

          GRADLE_DIR=$(dirname "$GRADLEW")

          echo "Found Gradle wrapper:"
          echo "$GRADLEW"

          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"
          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print \
              -quit)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using: $SDKMANAGER"

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

          yes | "$SDKMANAGER" --licenses || true

      # --------------------------------------------------
      # Build using the discovered Gradle wrapper
      # --------------------------------------------------
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x "$GRADLEW"

          "$GRADLEW" \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Searching for APK..."

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find . \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No debug APK was generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Show APK information
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ls -lh "$APK_PATH"

      - name: Upload NOVA-X APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-X-debug-apk
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
