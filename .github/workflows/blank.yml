name: NOVA-X APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Find ZIP
      - name: Find NOVA-X ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 4. Extract ZIP
      - name: Extract NOVA-X
        run: |
          rm -rf nova_project
          mkdir nova_project

          unzip -q "$ZIP_FILE" -d nova_project

          echo "ZIP extracted successfully."

      # 5. Find project
      - name: Locate NOVA-X project
        run: |
          PACKAGE_FILE=$(find nova_project \
            -type f \
            -name "package.json" \
            -print \
            -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 6. Verify project
      - name: Verify project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Project:"
          pwd

          echo "Files:"
          ls -la

          test -f package.json
          test -f index.html
          test -d src

      # 7. Install npm dependencies
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install

      # 8. Ensure Vue/Vite
      - name: Ensure Vue build tools
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install --save-dev \
            vite@7 \
            @vitejs/plugin-vue@6

          npm install vue@3

      # 9. Ensure Vite configuration
      - name: Ensure Vite configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f vite.config.js ] && \
             [ ! -f vite.config.mjs ] && \
             [ ! -f vite.config.ts ]; then

            cat > vite.config.js <<'EOF'
          import { defineConfig } from 'vite'
          import vue from '@vitejs/plugin-vue'

          export default defineConfig({
            plugins: [vue()]
          })
          EOF

            echo "Created vite.config.js"
          fi

      # 10. Build Vue
      - name: Build Vue application
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run build

      # 11. Verify dist
      - name: Verify web build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -d dist
          echo "Vue build successful."

      # 12. Install Capacitor
      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install --no-save \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7

      # 13. Initialize Capacitor
      - name: Initialize Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ]; then

            npx cap init NOVA-X com.novax --web-dir dist
          fi

      # 14. Add Android
      - name: Add Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      # 15. Sync Capacitor
      - name: Sync Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap sync android

      # 16. Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 17. Use preinstalled Android SDK
      - name: Setup Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          if [ -d "$ANDROID_HOME/cmdline-tools/16.0/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          fi

          echo "Android SDK:"
          ls -la "$ANDROID_HOME" || true

      # 18. Install only required Android packages
      - name: Install Android packages
        run: |
          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager \
              -type f \
              -print \
              -quit)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

          yes | "$SDKMANAGER" --licenses || true

      # 19. Build APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 20. Verify APK
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "       NOVA-X APK BUILD SUCCESS"
          echo "========================================"
          echo ""

          ls -lh "$APK"

      # 21. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-X-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
