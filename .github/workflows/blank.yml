name: NOVA-X APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v4

      # NODE.JS
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # FIND ZIP
      - name: Find NOVA-X ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: NOVA-X ZIP not found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # EXTRACT ZIP
      - name: Extract NOVA-X
        run: |
          rm -rf nova_project
          mkdir -p nova_project

          unzip -q "$ZIP_FILE" -d nova_project

          echo "ZIP extracted."

      # FIND PROJECT
      - name: Locate NOVA-X project
        run: |
          PACKAGE_FILE=$(find nova_project \
            -type f \
            -name "package.json" \
            -print \
            -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      # VERIFY PROJECT
      - name: Verify project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f package.json
          test -f index.html
          test -d src

          echo "Project verified."

      # NPM
      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install

      # VUE + VITE
      - name: Ensure Vue and Vite
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install vue@3
          npm install --save-dev vite@7 @vitejs/plugin-vue@6

      # VITE CONFIG
      - name: Ensure Vite Vue configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f vite.config.js ] && \
             [ ! -f vite.config.mjs ] && \
             [ ! -f vite.config.ts ]; then

            cat > vite.config.js <<'EOF'
          import { defineConfig } from 'vite'
          import vue from '@vitejs/plugin-vue'

          export default defineConfig({
            plugins: [vue()]
          })
          EOF

          fi

      # BUILD WEB APP
      - name: Build Vue application
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run build

      # VERIFY WEB BUILD
      - name: Verify web build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -d dist
          test -f dist/index.html

          echo "Vue build successful."

      # CAPACITOR
      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install --no-save \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7

      # CAPACITOR CONFIG
      - name: Configure Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ]; then

            npx cap init NOVA-X com.novax --web-dir dist
          fi

      # CREATE ANDROID PROJECT
      - name: Create Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf android

          npx cap add android

          npx cap sync android

      # JAVA 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # VERIFY JAVA
      - name: Verify Java
        run: |
          java -version
          javac -version

      # ANDROID SDK
      - name: Setup Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

      # ANDROID SDK PACKAGES
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print \
            -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

          yes | "$SDKMANAGER" --licenses || true

      # GRADLE
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # GENERATE GRADLE WRAPPER
      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          gradle wrapper --gradle-version 8.11.1

          if [ ! -f gradlew ]; then
            echo "ERROR: Gradle wrapper generation failed."
            exit 1
          fi

          chmod +x gradlew

          echo "Gradle wrapper generated successfully."

      # BUILD APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -o pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      # SHOW FAILURE DETAILS
      - name: Show Gradle failure details
        if: failure()
        run: |
          echo "========================================"
          echo "GRADLE BUILD FAILURE DETAILS"
          echo "========================================"

          if [ -f "$GITHUB_WORKSPACE/gradle-build.log" ]; then
            grep -n -A 40 -B 10 \
              -E "FAILURE:|What went wrong:|Execution failed for task|Caused by:" \
              "$GITHUB_WORKSPACE/gradle-build.log" || true

            echo ""
            echo "---- LAST 100 LINES ----"

            tail -n 100 "$GITHUB_WORKSPACE/gradle-build.log"
          else
            echo "gradle-build.log was not created."
          fi

      # LOCATE APK
      - name: Locate APK
        run: |
          APK=$(find "${PROJECT_DIR}/android" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          # Convert to a clean workspace-relative path.
          APK="${APK#./}"

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # APK INFORMATION
      - name: APK information
        run: |
          ls -lh "$APK_PATH"

      # UPLOAD APK
      - name: Upload NOVA-X APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-X-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
